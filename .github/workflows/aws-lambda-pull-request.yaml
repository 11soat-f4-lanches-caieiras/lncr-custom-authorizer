name: Build lncr-customer authorizer AWS Lambda 
on:
  push:
    branches:
      - develop 
  pull_request:
    branches:
      - master 
  
jobs:
  build:
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Install AWS SAM CLI # Instala o AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: SAM Build # Build da aplicacao Lambda usando SAM
        run: |
          sam build --debug --template aws-lambda/template.yaml
        #--parameter-overrides ImageName=${IMAGE_NAME} ImageTag=${IMAGE_TAG}
        env:
          LNCR_OAUTH_SECRET_KEY: ${{ secrets.LNCR_OAUTH_SECRET_KEY }}
  deploy:
    needs: build
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: SAM Deploy # Deploy da aplicacao Lambda usando SAM
        run: |
          sam deploy --debug --template-file .aws-sam/build/template.yaml --stack-name lncr-customer-authorizer --capabilities CAPABILITY_IAM --region us-east-1 --no-fail-on-empty-changeset
        env:
          LNCR_OAUTH_SECRET_KEY: ${{ secrets.LNCR_OAUTH_SECRET_KEY }}