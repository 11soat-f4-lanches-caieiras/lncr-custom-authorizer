name: Build and deploy lncr-customer-authorizer AWS Lambda
on:
  push:
    branches:
      - develop 

jobs:
  build:
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      
      - name: Build with maven
        run: |
          cd aws-lambda/CustomAuthorizer
          mvn clean package test

        env:
          LNCR_OAUTH_SECRET_KEY: ${{ secrets.LNCR_OAUTH_SECRET_KEY }}

      - name: Rename jar
        run: |
          HASH=$(git rev-parse --short HEAD)
          JAR_NAME=$(ls target/lncr-custom-authorizer*.jar | xargs -n1 basename | sed 's/\.jar$//')
          JAR_WITH_HASH=$JAR_NAME-$HASH.jar
          mv target/lncr-custom-authorizer-*.jar target/$JAR_WITH_HASH
          echo $JAR_WITH_HASH >> $GITHUB_ENV

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lncr-custom-authorizer
          path: target/$JAR_WITH_HASH
        env:
          JAR_WITH_HASH: ${{ env.JAR_WITH_HASH }}

  deploy:
    needs: build
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      dev
    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: lncr-custom-authorizer
          path: ./aws-lambda/CustomAuthorizer/target

      - name: Deploy to AWS Lambda
        uses: aws-actions/aws-lambda-deploy@v1
        with:
          function-name: ${{ env.AWS_LAMBDA_FUNCTION_NAME }}-${{job.environment}}
          zip-file: ./aws-lambda/CustomAuthorizer/target/${{ env.JAR_WITH_HASH }}
        env:
          JAR_WITH_HASH: ${{ env.JAR_WITH_HASH }}



