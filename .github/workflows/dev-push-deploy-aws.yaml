name: Build and deploy lncr-customer-authorizer AWS Lambda
on:
  push:
    branches:
      - develop 

jobs:
  build:
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Paths and Env Variables
        run: |
            APP_PATH=$PWD/aws-lambda/CustomAuthorizer
            echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
            echo "TARGET_PATH=$APP_PATH/target" >> $GITHUB_ENV
            echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
            

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Get ArtifactId
        run: |

          ARTIFACT_ID=$(mvn -f $APP_PATH/pom.xml help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_ENV

        env:
          APP_PATH: ${{ env.APP_PATH }}
          LNCR_OAUTH_SECRET_KEY: ${{ secrets.LNCR_OAUTH_SECRET_KEY }}
      
      - name: Build with maven
        run: |
          
          cd $APP_PATH
          mvn clean package test

        env:
          APP_PATH: ${{ env.APP_PATH }}
          LNCR_OAUTH_SECRET_KEY: ${{ secrets.LNCR_OAUTH_SECRET_KEY }}

      - name: Rename jar
        run: |
          JAR_WITH_HASH=$(ls $ARTIFACT_PATH* | xargs -n1 basename | sed 's/\.jar$//')-$HASH.jar
          mv $ARTIFACT_PATH*.jar $TARGET_PATH/$JAR_WITH_HASH
          echo "JAR_WITH_HASH=$JAR_WITH_HASH" >> $GITHUB_ENV
        env:
          ARTIFACT_PATH: ${{ env.TARGET_PATH }}/${{env.ARTIFACT_ID}}
          HASH: ${{ env.COMMIT_HASH }}
          TARGET_PATH: ${{ env.TARGET_PATH }}

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: $AWS_LAMBDA_FUNCTION_NAME
          path: $TARGET_PATH/$JAR_WITH_HASH
        env:
          TARGET_PATH: ${{ env.TARGET_PATH }}
          AWS_LAMBDA_FUNCTION_NAME: ${{ env.AWS_LAMBDA_FUNCTION_NAME }}
          JAR_WITH_HASH: ${{ env.JAR_WITH_HASH }}

      - name: Export build environment variables as outputs
        run: |
          echo "::set-output name=APP_PATH=${APP_PATH}" >> $GITHUB_ENV
          echo "::set-output name=TARGET_PATH=${TARGET_PATH}" >> $GITHUB_ENV
          echo "::set-output name=COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "::set-output name=ARTIFACT_ID=${ARTIFACT_ID}" >> $GITHUB_ENV
          echo "::set-output name=JAR_WITH_HASH=${JAR_WITH_HASH}" >> $GITHUB_ENV
          echo "::set-output name=AWS_LAMBDA_FUNCTION_NAME=${AWS_LAMBDA_FUNCTION_NAME}" >> $GITHUB_ENV
        env:
          APP_PATH: ${{ env.APP_PATH }}
          TARGET_PATH: ${{ env.TARGET_PATH }}
          COMMIT_HASH: ${{ env.COMMIT_HASH }}
          ARTIFACT_ID: ${{ env.ARTIFACT_ID }}
          JAR_WITH_HASH: ${{ env.JAR_WITH_HASH }}
          AWS_LAMBDA_FUNCTION_NAME: ${{ env.AWS_LAMBDA_FUNCTION_NAME }}
    outputs:
      APP_PATH: ${{ env.APP_PATH }}
      TARGET_PATH: ${{ env.TARGET_PATH }}
      COMMIT_HASH: ${{ env.COMMIT_HASH }}
      ARTIFACT_ID: ${{ env.ARTIFACT_ID }}
      JAR_WITH_HASH: ${{ env.JAR_WITH_HASH }}
      AWS_LAMBDA_FUNCTION_NAME: ${{ env.AWS_LAMBDA_FUNCTION_NAME }}





  deploy:
    needs: build
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      dev
    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.AWS_LAMBDA_FUNCTION_NAME }}
          path: ${{ needs.build.outputs.TARGET_PATH }}/${{ needs.build.outputs.JAR_WITH_HASH }}

      - name: Deploy to AWS Lambda
        uses: aws-actions/aws-lambda-deploy@v5
        with:
          function-name: $AWS_LAMBDA_FUNCTION_NAME-$ENVIRONMENT
          zip-file: $TARGET_PATH/$JAR_WITH_HASH
          handler: br.com.tp.lncr.aws.lambda.CustomAuthorizer::handleRequest
          runtime: java21
          architecture: arm64
          memory-size: 1024
          timeout: 30
          environment-variables: |
            LNCR_OAUTH_SECRET_KEY=$LNCR_OAUTH_SECRET_KEY
          description: "Deploy automático do lncr-customer-authorizer - commit ${{ needs.build.outputs.COMMIT_HASH }}"
        env:
          AWS_LAMBDA_FUNCTION_NAME: ${{ needs.build.outputs.AWS_LAMBDA_FUNCTION_NAME }}
          TARGET_PATH: ${{ needs.build.outputs.TARGET_PATH }}
          JAR_WITH_HASH: ${{ needs.build.outputs.JAR_WITH_HASH }}
          ENVIRONMENT: ${{ job.environment }}
          LNCR_OAUTH_SECRET_KEY: ${{ secrets.LNCR_OAUTH_SECRET_KEY }}
