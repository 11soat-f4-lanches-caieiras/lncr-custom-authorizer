name: Build and deploy lncr-customer-authorizer AWS Lambda
on:
  push:
    branches:
      - develop 

jobs:
  build:
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set Paths and Env Variables
        run: |
            APP_PATH=$PWD/aws-lambda/CustomAuthorizer
            echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
            echo "TARGET_PATH=$APP_PATH/target" >> $GITHUB_ENV
            echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
            

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      
      - name: Build with maven
        run: |
          
          ARTIFACT_ID=$(mvn -f $APP_PATH/pom.xml help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_ENV
          
          cd $APP_PATH
          mvn clean package test

        env:
          APP_PATH: ${{ env.APP_PATH }}
          LNCR_OAUTH_SECRET_KEY: ${{ secrets.LNCR_OAUTH_SECRET_KEY }}

      - name: Rename jar
        run: |
          JAR_WITH_HASH=$(ls $ARTIFACT_PATH* | xargs -n1 basename)-$HASH.jar
          mv $ARTIFACT_PATH*.jar TARGET_PATH/$JAR_WITH_HASH
          echo $JAR_WITH_HASH >> $GITHUB_ENV
        env:
          ARTIFACT_PATH: ${{ env.TARGET_PATH }}/${{env.ARTIFACT_ID}}
          HASH: ${{ env.COMMIT_HASH }}
          TARGET_PATH: ${{ env.TARGET_PATH }}

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lncr-custom-authorizer
          path: target/$JAR_WITH_HASH
        env:
          JAR_WITH_HASH: ${{ env.JAR_WITH_HASH }}

  deploy:
    needs: build
    runs-on: codebuild-lncr-codebuild-project-github-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      dev
    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: lncr-custom-authorizer
          path: ./aws-lambda/CustomAuthorizer/target

      - name: Deploy to AWS Lambda
        uses: aws-actions/aws-lambda-deploy@v1
        with:
          function-name: ${{ env.AWS_LAMBDA_FUNCTION_NAME }}-${{job.environment}}
          zip-file: ./aws-lambda/CustomAuthorizer/target/${{ env.JAR_WITH_HASH }}
        env:
          JAR_WITH_HASH: ${{ env.JAR_WITH_HASH }}



